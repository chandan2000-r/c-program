<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surprise</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, #fff5f7 0%, #ffdce8 25%, #ffc9dc 48%, #fce7ef 100%);
        color: #4d1a2d;
        overflow: hidden;
      }

      .hearts {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-size: 2rem;
        opacity: 0.28;
      }

      .hearts span {
        position: absolute;
        animation: floatUp 9s linear infinite;
      }

      .hearts span:nth-child(1) { left: 12%; top: 18%; animation-delay: 0s; }
      .hearts span:nth-child(2) { left: 22%; top: 68%; animation-delay: 1.4s; }
      .hearts span:nth-child(3) { left: 46%; top: 16%; animation-delay: 2.2s; }
      .hearts span:nth-child(4) { left: 66%; top: 70%; animation-delay: 0.8s; }
      .hearts span:nth-child(5) { left: 82%; top: 24%; animation-delay: 2.7s; }
      .hearts span:nth-child(6) { left: 58%; top: 60%; animation-delay: 1.7s; }

      @keyframes floatUp {
        0% {
          transform: translateY(20px) scale(0.9);
          opacity: 0;
        }
        20% { opacity: 0.8; }
        100% {
          transform: translateY(-120px) scale(1.2);
          opacity: 0;
        }
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(92vw, 540px);
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 28px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(174, 58, 98, 0.18);
        backdrop-filter: blur(10px);
      }

      .title {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 6vw, 3.4rem);
        color: #c61b69;
        text-shadow: 0 4px 18px rgba(198, 27, 105, 0.18);
      }

      .subtitle {
        margin: 0 0 24px;
        color: #7d3a56;
        font-size: 1.08rem;
        letter-spacing: 0.05em;
      }

      .surprise-btn, .love-btn, .hate-btn {
        border: none;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      .surprise-btn {
        display: inline-block;
        text-decoration: none;
        background: linear-gradient(135deg, #ff5d92, #ff7aa1);
        color: #fff;
        padding: 16px 28px;
        border-radius: 999px;
        font-size: 1.08rem;
        box-shadow: 0 14px 30px rgba(255, 93, 146, 0.28);
      }

      .surprise-btn:hover, .love-btn:hover, .hate-btn:hover {
        transform: translateY(-2px);
      }

      .hidden { display: none !important; }

      .message-panel {
        position: relative;
        margin-top: 18px;
        min-height: 180px;
      }

      .love-text {
        font-size: clamp(1.7rem, 4vw, 2.6rem);
        font-weight: 800;
        margin: 0 0 22px;
        color: #a11452;
      }

      .reply-wrap {
        position: relative;
        width: 100%;
        height: 120px;
      }

      .love-btn, .hate-btn {
        position: absolute;
        padding: 14px 20px;
        border-radius: 999px;
        font-size: 1rem;
        box-shadow: 0 12px 24px rgba(124, 58, 237, 0.2);
      }

      .love-btn {
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        color: #fff;
      }

      .love-btn:hover { box-shadow: 0 16px 28px rgba(124, 58, 237, 0.3); }

      .hate-btn {
        left: 22%;
        top: 52%;
        background: linear-gradient(135deg, #ef4444, #f87171);
        color: #fff;
      }

      .hate-btn:hover { box-shadow: 0 16px 28px rgba(239, 68, 68, 0.26); }

      .result {
        margin-top: 16px;
        font-size: 1rem;
        color: #8d1d59;
        font-weight: 700;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <div class="hearts" aria-hidden="true">
      <span>💖</span>
      <span>💗</span>
      <span>💞</span>
      <span>💘</span>
      <span>💝</span>
      <span>💖</span>
    </div>

    <div class="card" id="card">
      <h1 class="title">A surprise for you</h1>
      <p class="subtitle">Open the link below</p>

      <button class="surprise-btn" id="openBtn">Open the link</button>

      <div class="message-panel hidden" id="messagePanel">
        <p class="love-text">I love you Ruthika ❤️</p>

        <div class="reply-wrap" id="replyWrap">
          <button class="hate-btn" id="hateBtn">I hate you</button>
          <button class="love-btn" id="loveBtn">I love you too Chandan</button>
        </div>

        <div class="result" id="resultText">Choose carefully 💌</div>
      </div>
    </div>

    <script>
      const openBtn = document.getElementById('openBtn');
      const messagePanel = document.getElementById('messagePanel');
      const loveBtn = document.getElementById('loveBtn');
      const hateBtn = document.getElementById('hateBtn');
      const resultText = document.getElementById('resultText');
      const replyWrap = document.getElementById('replyWrap');

      function playMusic() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        const audioCtx = new AudioContext();
        const notes = [261.63, 329.63, 392.0, 523.25, 392.0, 329.63];

        notes.forEach((note, index) => {
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = note;
          gainNode.gain.value = 0.0001;

          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          const startAt = audioCtx.currentTime + index * 0.18;
          oscillator.start(startAt);
          gainNode.gain.exponentialRampToValueAtTime(0.08, startAt + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.28);
          oscillator.stop(startAt + 0.3);
        });
      }

      function moveHateButton() {
        const safePadding = 18;
        const maxX = replyWrap.clientWidth - hateBtn.offsetWidth - safePadding;
        const maxY = replyWrap.clientHeight - hateBtn.offsetHeight - safePadding;

        const left = Math.random() * Math.max(maxX, 0);
        const top = Math.random() * Math.max(maxY, 0);

        hateBtn.style.left = `${left}px`;
        hateBtn.style.top = `${top}px`;
      }

      openBtn.addEventListener('click', () => {
        messagePanel.classList.remove('hidden');
        openBtn.classList.add('hidden');
        playMusic();
      });

      loveBtn.addEventListener('click', () => {
        loveBtn.textContent = 'I love you too Chandan 💖';
        resultText.textContent = 'You chose love!';
      });

      hateBtn.addEventListener('mouseenter', moveHateButton);
      hateBtn.addEventListener('focus', moveHateButton);
      hateBtn.addEventListener('click', (event) => {
        event.preventDefault();
        moveHateButton();
      });

      replyWrap.addEventListener('pointermove', (event) => {
        const rect = hateBtn.getBoundingClientRect();
        const pointerX = event.clientX;
        const pointerY = event.clientY;

        const distance = Math.hypot(
          pointerX - (rect.left + rect.width / 2),
          pointerY - (rect.top + rect.height / 2)
        );

        if (distance < 120) {
          moveHateButton();
        }
      });
    </script>
  </body>
</html>
